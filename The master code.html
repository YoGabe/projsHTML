<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Cadastro de novo usúario </title>

    <body>
        <h1> Cadastro de usúario </h1>
        <h2> Informações básicas </h2>
        <form>
            <label for="name"> Nome completo:</label>
            <input type="text" name="nome" id="name" required><br>

            <label for="age"> Data de nascimento: </label>
            <input type="date" name="idade" id="age" required><br>
            
            <label for="mail"> E-mail: </label>
            <input type="email" name="email" id="mail" placeholder="nome.exemplo@seuemail.com" style="width: 190px; height: 15px;" required><br>

            <label for="tele"> Telefone: + </label>
            <input type="number" name="ddi" id="tele" min="1" max="998" style="width: 38px;" required>
            <input type="tel" name="telefone" id="tele" placeholder="1234-5678" pattern="[0-9]{4}-[0-9]{4}"><br><br>

            <button type="submit" id="botaozin" disabled> Concluir cadastro</button>
        </form>
    </select> <br><br>
    </body>
